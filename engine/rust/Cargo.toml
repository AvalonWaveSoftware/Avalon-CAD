[package]
name = "avalon-mesh"
version = "2.3.1"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
# ADR-0001 F2a: raw DEFLATE for the 3MF (zip) writer. Vendored in engine/rust/vendor so builds stay offline.
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }

[features]
# Stage timings for tests/perf/export-3mf-profile.mjs only; never in the shipped mesh-core.wasm.
profile = []

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
