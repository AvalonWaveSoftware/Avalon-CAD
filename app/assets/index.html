<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10191f"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'"><title>AvalonCad</title><link rel="stylesheet" href="style.css?v=2.6.0"></head><body>
<div id="app">
<header><button class="brand" id="projectMenu" aria-label="Project menu"><svg viewBox="0 0 32 32"><path d="M16 2 29 9v14l-13 7L3 23V9Z M3 9l13 7 13-7 M16 16v14 M9 5.8l13 7v14"/></svg><span>Avalon<b>Cad</b><small id="projectName">My model</small></span><span class="chevron">⌄</span></button><button id="layersBtn" class="layersbtn" aria-label="Model layers">Layer 1 ▾</button><button id="helpBtn" class="iconbtn" aria-label="Help">?</button></header>
<div class="toolbar"><div><button id="undo" title="Undo" aria-label="Undo">↶</button><button id="redo" title="Redo" aria-label="Redo">↷</button></div><span class="toolstatus"><span id="busy">Loading solid engine…</span><span id="unsavedMarker" class="unsavedmark" hidden title="Autosave is paused">● Not autosaved</span></span><div><button id="wire" title="Wireframe" aria-label="Wireframe">▧</button><button id="fit" title="Fit model" aria-label="Fit model">⛶</button></div></div>
<div class="floorbar"><label for="buildPlane"><input id="buildPlane" type="checkbox" role="switch" checked><span>Build plane</span></label><span id="buildPlaneStatus">On · stops at Z=0</span><small>Never exported</small></div>
<nav id="touchModes" class="touchmodes"><button data-mode="select" class="active">Select</button><button data-mode="move">Move</button><button data-mode="stretch">Stretch</button><button data-mode="round">Round</button></nav><div id="axisTools" class="axistools" hidden><button data-axis="X">X</button><button data-axis="Y">Y</button><button data-axis="Z">Z</button><button data-axis="XY" class="active">XY</button><select id="dragStep" aria-label="Drag precision"><option value="0">Free</option><option value="0.1" selected>0.1 mm</option><option value="1">1 mm</option></select><button id="snapStatus" class="active">Snap on</button></div><main id="viewport"><canvas id="scene" aria-label="3D model viewport"></canvas><button id="objectsToggle" class="objectstoggle" aria-controls="objectsPanel" aria-expanded="false" aria-label="Objects">☰ <small id="objectCount">0</small></button><aside id="objectsPanel" class="objectspanel" hidden aria-label="Objects"><div class="panelhead">Objects<button id="objectsAdd" aria-label="Add shape">＋</button></div><div id="objectsList" role="tree" aria-multiselectable="true"></div><div id="objectsActions" class="objectsactions" hidden><span id="objectsSelCount"></span><button id="objectsMerge">Merge</button><button id="objectsPrefab">Create Prefab</button></div></aside><div id="empty" hidden><div class="emptycube">◇</div><h2>Your next idea starts here.</h2><p>Add a shape, enter its dimensions,<br>and turn it into a printable part.</p><button class="primary" id="firstShape">＋ Add a shape</button></div><nav class="views" aria-label="Camera views"><button data-view="iso" class="active">3D</button><button data-view="top">TOP</button><button data-view="front">FRONT</button><button data-view="right">RIGHT</button></nav><div class="axis"><i>X</i><i>Y</i><i>Z</i><span>mm</span></div><div class="gesture" id="touchHint">Tap a face · double-tap for the whole shape</div><div id="liveMeasure" class="livemeasure" hidden></div><div id="bounds"></div></main>
<div id="touchAction" class="touchaction" hidden></div><div class="selection"><div><span class="selectiondot"></span><span id="selectionLabel">No object selected</span></div><div><button id="mergeBtn" hidden>Merge</button><button id="deselectBtn" aria-label="Deselect everything">Clear</button><button id="quickEdit">Edit dimensions →</button></div></div>
<nav class="dock"><button id="addBtn"><span>＋</span>Add</button><button id="editBtn"><span>⌑</span>Edit</button><button id="exportBtn" class="export"><span>⇩</span>Export STL</button></nav>
</div><div id="shade" hidden></div><section id="sheet" class="sheet" hidden aria-label="CAD tools"><div class="sheethead"><div><span id="sheetEyebrow">AvalonCad</span><h2 id="sheetTitle"></h2></div><button id="closeSheet" aria-label="Close panel">✕</button></div><div id="sheetContent"></div></section><div id="toast" role="status" hidden></div><input id="importFile" type="file" accept=".tcad,.avprefab,.json,.stl" hidden><script type="module" src="main.js?v=2.6.0"></script></body></html>
